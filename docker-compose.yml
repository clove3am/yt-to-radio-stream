services:
  radio:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${RADIO_IMAGE:-yt-radio-stream:latest}
    container_name: yt-radio
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DATA_DIR: /data
      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ON_DEMAND_IDLE_SECONDS: ${ON_DEMAND_IDLE_SECONDS:-30}
      ON_DEMAND_START_TIMEOUT: ${ON_DEMAND_START_TIMEOUT:-75}
      TUNING_AUDIO: ${TUNING_AUDIO:-music}
      YTDLP_COOKIES_FILE: ${YTDLP_COOKIES_FILE:-/data/cookies.txt}
      YTDLP_EXTRA_ARGS: ${YTDLP_EXTRA_ARGS:-}
      TZ: ${TZ:-UTC}
    volumes:
      - radio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

volumes:
  radio-data:
